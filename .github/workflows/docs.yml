name: Docs

on:
  push:
    branches: [ "master" ]
    paths:
      - 'docs/**'
      - 'fastapi_cachex/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'zensical.toml'
      - 'zensical.zh-TW.toml'
      - 'i18n/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'docs/**'
      - 'fastapi_cachex/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'zensical.toml'
      - 'zensical.zh-TW.toml'
      - 'i18n/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    # Same command Read the Docs runs; a broken link or docstring reference
    # fails the PR here instead of the published site.
    - name: Sync dependencies
      run: uv sync --frozen --only-group docs --no-install-project

    - name: Build (strict)
      run: uv run --no-sync zensical build --strict

    - name: Build Traditional Chinese translation (strict)
      run: uv run --no-sync zensical build --strict -f zensical.zh-TW.toml
