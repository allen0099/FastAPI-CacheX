name: Docs

on:
  push:
    branches: [ "master" ]
    paths:
      - 'docs/**'
      - 'fastapi_cachex/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'zensical.toml'
      - 'zensical.zh-TW.toml'
      - 'i18n/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'docs/**'
      - 'fastapi_cachex/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'zensical.toml'
      - 'zensical.zh-TW.toml'
      - 'i18n/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # renovate: datasource=pypi depName=uv
        version: "0.13.7"

    # What Read the Docs runs, except that a stale lock file fails here
    # (--locked) where the published build uses it as it is (--frozen). A
    # broken link or docstring reference fails the PR here instead of the
    # published site.
    - name: Sync dependencies
      run: uv sync --locked --only-group docs --no-install-project

    - name: Build (strict)
      run: uv run --no-sync zensical build --strict

    - name: Build Traditional Chinese translation (strict)
      run: uv run --no-sync zensical build --strict -f zensical.zh-TW.toml
