name: Docs

on:
  push:
    branches: [ "master" ]
    paths:
      - 'docs/**'
      - 'fastapi_cachex/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'zensical.toml'
      - 'zensical.zh-TW.toml'
      - 'i18n/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'docs/**'
      - 'fastapi_cachex/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'zensical.toml'
      - 'zensical.zh-TW.toml'
      - 'i18n/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    # Same command Read the Docs runs; a broken link or docstring reference
    # fails the PR here instead of the published site.
    - name: Sync dependencies
      run: uv sync --frozen --only-group docs --no-install-project

    - name: Build (strict)
      run: uv run --no-sync zensical build --strict

    - name: Build Traditional Chinese translation (strict)
      run: uv run --no-sync zensical build --strict -f zensical.zh-TW.toml
