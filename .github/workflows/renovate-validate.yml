name: Validate Renovate Config

on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/renovate.json5'
      - '.github/workflows/renovate-validate.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - '.github/renovate.json5'
      - '.github/workflows/renovate-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    # Pinned, so the check does not change under a pull request; Renovate
    # raises the version (see customManagers in renovate.json5).
    - name: Validate Renovate config
      # renovate: datasource=npm depName=renovate
      run: npx --yes --package renovate@44.227.4 -- renovate-config-validator --strict
