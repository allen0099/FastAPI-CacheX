name: Lowest dependencies

on:
  push:
    branches: [ "master" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'tox.ini'
      - '.github/workflows/lowest.yml'
  # No paths filter on pull requests, so this check can be required before
  # merging: a required check that never starts blocks the pull request.
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lowest:
    # Every direct dependency at the lower bound pyproject.toml declares, on
    # the oldest supported Python (the `lowest` tox env). The other test jobs
    # install the locked, newest versions, so a floor that is too low for the
    # code only shows up here.
    runs-on: ubuntu-latest

    services:
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        # The oldest supported Python. Renovate leaves it alone (see
        # .github/renovate.json5).
        python-version: "3.10"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Sync dependencies
      run: uv sync

    - name: Test with the lowest direct dependencies
      run: uv run tox -e lowest
      env:
        # The live suites are opt-in; these are the service containers above.
        CACHEX_TEST_REDIS_PORT: 6379
        CACHEX_TEST_MEMCACHED_PORT: 11211
        # A skipped live suite would leave the redis and memcached floors
        # untested, so treat it as a failure.
        CACHEX_REQUIRE_LIVE_SERVERS: 1
