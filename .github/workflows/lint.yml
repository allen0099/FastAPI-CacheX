name: Lint

on:
  push:
    branches: [ "master" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
  # No paths filter on pull requests, so this check can be required before
  # merging: a required check that never starts blocks the pull request. It
  # also covers pull requests that only touch files outside the push filter,
  # such as CHANGELOG.md, whose format tests/test_changelog_release.py checks.
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # renovate: datasource=pypi depName=uv
        version: "0.13.7"

    - name: Sync dependencies
      run: uv sync --locked --group dev

    # `tests` is linted here too. On a commit pre-commit only sees staged
    # files, so test code that was never touched again drifts; that is how the
    # suite came to have unsorted imports, three unformatted files and six
    # type errors that nobody saw. These steps use the locked tool versions;
    # the pre-commit step at the end runs the hooks' own, except mypy, which
    # uses the locked environment too.
    - name: Ruff check
      run: uv run ruff check fastapi_cachex tests scripts

    - name: Ruff format check
      run: uv run ruff format --check fastapi_cachex tests scripts

    - name: Mypy strict
      run: uv run mypy fastapi_cachex --strict

    - name: Mypy (tests)
      run: uv run mypy tests

    - name: Mypy (scripts)
      run: uv run mypy scripts

    # What a release would publish: build the wheel and check it installed on
    # its own, since everything above runs from the source tree (#241).
    - name: Build and check the wheel
      run: |
        set -euo pipefail
        uv build --out-dir "$RUNNER_TEMP/dist"
        wheel="$(ls "$RUNNER_TEMP"/dist/*.whl)"
        uv run --isolated --no-project --with "$wheel" \
          python scripts/check_wheel.py "$wheel"

    # The hooks contributors run before committing. Renovate automerges hook
    # updates on a green CI, so CI has to run them: otherwise an update that
    # fails on the tree leaves master red locally and green here (#453, #505).
    - name: pre-commit
      run: uv run pre-commit run --all-files --show-diff-on-failure
