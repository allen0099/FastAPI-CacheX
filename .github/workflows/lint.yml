name: Lint

on:
  push:
    branches: [ "master" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Sync dependencies
      run: uv sync --group dev --extra jwt

    # `tests` is linted here too. pre-commit only sees staged files, so test
    # code that was never touched again drifts; that is how the suite came to
    # have unsorted imports, three unformatted files and six type errors that
    # nobody saw. Strict mypy stays package-only, matching CLAUDE.md.
    - name: Ruff check
      run: uv run ruff check fastapi_cachex tests scripts

    - name: Ruff format check
      run: uv run ruff format --check fastapi_cachex tests scripts

    - name: Mypy strict
      run: uv run mypy fastapi_cachex --strict

    - name: Mypy (tests)
      run: uv run mypy tests

    - name: Mypy (scripts)
      run: uv run mypy scripts
