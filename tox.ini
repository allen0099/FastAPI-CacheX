[tox]
min_version = 4.0
env_list =
    py311
    py312
    py313
    py314
    py315

[testenv]
runner = uv-venv-lock-runner
extras =
    redis
    memcached
# The Redis/Memcached suites are opt-in because they wipe the server they
# connect to; without these they skip. See tests/live_servers.py.
passenv =
    CACHEX_TEST_REDIS_HOST
    CACHEX_TEST_REDIS_PORT
    CACHEX_TEST_MEMCACHED_HOST
    CACHEX_TEST_MEMCACHED_PORT
    CACHEX_REQUIRE_LIVE_SERVERS
commands = pytest {posargs:tests}

# Oldest supported stack: every direct dependency of the package, extras
# included, at the lower bound declared in pyproject.toml, on the oldest
# supported Python. Not in env_list; run it with `tox -e lowest`.
[testenv:lowest]
runner = uv-venv-runner
base_python = python3.11
uv_resolution = lowest-direct
extras =
    redis
    memcached
# These are direct requirements here too, so they resolve to their floors.
# starlette is not a direct dependency of the package, so it is listed here to
# test the oldest release the fastapi floor accepts (fastapi 0.128.2 requires
# starlette>=0.40.0); keep the two in step. That starlette's TestClient needs
# httpx (newer releases use httpx2), and its SessionMiddleware, used by the
# session-bypass tests, needs itsdangerous.
deps =
    httpx>=0.27.0
    itsdangerous>=1.1.0
    starlette>=0.40.0
    pytest>=8.3.5
    pytest-asyncio>=0.26.0

# Newest stack: every direct dependency at its newest release, ignoring
# uv.lock, on the newest supported Python. Renovate waits a few days before
# it updates the lock file, but `pip install fastapi-cachex` gets a new
# pydantic at once, so this env tries what a fresh install gets. It prints
# which core schema types `@cached` keeps on its fast path on that pydantic
# (see fastapi_cachex/_plain_schema.py, #671): a type missing from the list
# is searched instead, so a change there costs speed, not safety. Not in
# env_list; run it with `tox -e newest`.
[testenv:newest]
runner = uv-venv-runner
base_python = python3.15
uv_resolution = highest
extras =
    redis
    memcached
deps =
    httpx2
    itsdangerous
    pytest
    pytest-asyncio
commands_pre =
    python -c "import pydantic; from fastapi_cachex._plain_schema import _CHILD_KEYS, _MIXINS, _verified_types; print('pydantic', pydantic.VERSION, '- off the @cached fast path:', sorted((set(_CHILD_KEYS) | set(_MIXINS)) - _verified_types()))"
