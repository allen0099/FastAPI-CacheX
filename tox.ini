[tox]
min_version = 4.0
env_list =
    py310
    py311
    py312
    py313
    py314

[testenv]
runner = uv-venv-lock-runner
extras =
    redis
    memcached
# The Redis/Memcached suites are opt-in because they wipe the server they
# connect to; without these they skip. See tests/live_servers.py.
passenv =
    CACHEX_TEST_REDIS_HOST
    CACHEX_TEST_REDIS_PORT
    CACHEX_TEST_MEMCACHED_HOST
    CACHEX_TEST_MEMCACHED_PORT
    CACHEX_REQUIRE_LIVE_SERVERS
commands = pytest {posargs:tests}

# Oldest supported stack: every direct dependency of the package, extras
# included, at the lower bound declared in pyproject.toml, on the oldest
# supported Python. Not in env_list; run it with `tox -e lowest`.
[testenv:lowest]
runner = uv-venv-runner
base_python = python3.10
uv_resolution = lowest-direct
extras =
    redis
    memcached
# These are direct requirements here too, so they resolve to their floors.
# starlette is not a direct dependency of the package, so it is listed here to
# test the oldest release the fastapi floor accepts (fastapi 0.128.2 requires
# starlette>=0.40.0); keep the two in step. That starlette's TestClient needs
# httpx (newer releases use httpx2), and its SessionMiddleware, used by the
# session-bypass tests, needs itsdangerous.
deps =
    httpx>=0.27.0
    itsdangerous>=1.1.0
    starlette>=0.40.0
    pytest>=8.3.5
    pytest-asyncio>=0.26.0

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
