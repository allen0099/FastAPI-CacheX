# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - post-merge
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [ --unsafe ]
      - id: check-json
      - id: check-added-large-files
        args: [ '--maxkb=1024' ]
      - id: detect-private-key
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        name: Lint with ruff
        args: [ --fix ]
      - id: ruff-format
        name: Format with ruff
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
        name: Update uv lockfile
      - id: uv-sync
  - repo: local
    hooks:
      - id: mypy
        name: Static type checking with mypy
        # Runs the project's own mypy against the locked environment
        # (`uv sync --group dev`), the same versions CI type-checks with. A
        # hook environment of its own would install the newest release of
        # every dependency on each fresh build, so a new upstream release
        # could fail the check on an unrelated change (#505).
        # --locked: a stale uv.lock stops the hook instead of being rewritten.
        entry: uv run --locked mypy --strict
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^(docs/|scripts/)
